# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1
  CIRRUS_CACHE_HOST: http://127.0.0.1:12321/
  REPO_USE_CIRRUS_RUNNERS: 'bitcoin/bitcoin'

defaults:
  run:
    shell: bash

# Small helper job to decide what runner provider to use.
# Other jobs can depend on it and reference needs.runners.outputs.provider
runners:
  name: Select runner provider
  runs-on: ubuntu-latest
  outputs:
    provider: ${{ steps.select.outputs.provider }}
  steps:
    - id: select
      run: |
        if [[ "${REPO_USE_CIRRUS_RUNNERS}" == "${{ github.repository }}" ]]; then
          echo "provider=cirrus" >> "$GITHUB_OUTPUT"
          echo "::notice title=Runner Selection::Using Cirrus Runners"
        else
          echo "provider=gha" >> "$GITHUB_OUTPUT"
          echo "::notice title=Runner Selection::Using GitHub-hosted runners"
        fi

# Example placeholder build job (kept similar to your original)
build:
  needs: runners
  runs-on: ubuntu-22.04-arm
  strategy:
    matrix:
      # keep this tiny or expand with real dimensions (arch, os, job-type, etc.)
      job: [1]
  steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Runner provider (debug)
      run: echo "Selected provider: ${{ needs.runners.outputs.provider }}"

    # Add your build/test steps here
    - name: Placeholder - show uptime
      run: uptime

# test-each-commit job — kept logic but fixed minor shell/yaml issues
test-each-commit:
  name: 'test each commit'
  runs-on: ubuntu-24.04
  if: github.event_name == 'pull_request' && github.event.pull_request.commits != 1
  timeout-minutes: 360
  env:
    MAX_COUNT: 6
  steps:
    - name: Determine fetch depth
      run: echo "FETCH_DEPTH=$((${{ github.event.pull_request.commits }} + 2))" >> "$GITHUB_ENV"

    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: ${{ env.FETCH_DEPTH }}

    - name: Determine commit range
      run: |
        git checkout HEAD~
        MERGE_BASE=$(git rev-list -n1 --merges HEAD || true)
        EXCLUDE_MERGE_BASE_ANCESTORS=
        if test -n "$MERGE_BASE"; then
          EXCLUDE_MERGE_BASE_ANCESTORS=^${MERGE_BASE}^@
        fi
        echo "TEST_BASE=$(git rev-list -n$((${{ env.MAX_COUNT }} + 1)) --reverse HEAD $EXCLUDE_MERGE_BASE_ANCESTORS | head -1)" >> "$GITHUB_ENV"

    - run: |
        git fetch origin "${GITHUB_BASE_REF}"
        git config user.email "ci@example.com"
        git config user.name "CI"

    - run: |
        sudo apt-get update
        sudo apt-get install -y clang mold ccache build-essential cmake ninja-build pkgconf python3-zmq libevent-dev libboost-dev libsqlite3-dev systemtap-sdt-dev libzmq3-dev qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev capnproto libcapnp-dev
        sudo pip3 install --break-system-packages pycapnp

    - name: Compile and run tests
      run: |
        git rebase --exec "git merge --no-commit origin/${GITHUB_BASE_REF} && python3 ./.github/ci-test-each-commit-exec.py && git reset --hard" ${{ env.TEST_BASE }}

# macOS native job (kept content, fixed minor YAML)
macos-native-arm64:
  name: macOS native
  runs-on: macos-15
  if: ${{ vars.SKIP_BRANCH_PUSH != 'true' || github.event_name == 'pull_request' }}
  timeout-minutes: 120
  strategy:
    fail-fast: false
    matrix:
      job-type: [standard, fuzz]
      include:
        - job-type: standard
          file-env: './ci/test/00_setup_env_mac_native.sh'
          job-name: 'macOS native, no depends, sqlite only, gui'
        - job-type: fuzz
          file-env: './ci/test/00_setup_env_mac_native_fuzz.sh'
          job-name: 'macOS native, fuzz'
  env:
    DANGER_RUN_CI_ON_HOST: 1
    BASE_ROOT_DIR: ${{ github.workspace }}
  steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event_name == 'pull_request' && github.ref || '' }}
    - name: Clang version
      run: |
        sudo xcode-select --switch /Applications/Xcode_16.0.app || true
        clang --version
    - name: Install Homebrew packages
      run: |
        brew install --quiet python@3 || brew link --overwrite python@3
        brew install --quiet coreutils ninja pkgconf gnu-getopt ccache boost libevent zeromq qt@6 qrencode capnp
    - name: Set Ccache directory
      run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache_dir" >> "$GITHUB_ENV"
    - name: CI script
      run: ./ci/test_run_all.sh
      env:
        FILE_ENV: ${{ matrix.file-env }}

# windows-native-dll (kept structure; only minor corrections)
windows-native-dll:
  name: Windows native
  runs-on: windows-2022
  if: ${{ vars.SKIP_BRANCH_PUSH != 'true' || github.event_name == 'pull_request' }}
  env:
    PYTHONUTF8: 1
    TEST_RUNNER_TIMEOUT_FACTOR: 40
  strategy:
    fail-fast: false
    matrix:
      job-type: [standard, fuzz]
      include:
        - job-type: standard
          generate-options: '-DBUILD_GUI=ON -DWITH_ZMQ=ON -DBUILD_BENCH=ON -DBUILD_KERNEL_LIB=ON -DBUILD_UTIL_CHAINSTATE=ON -DWERROR=ON'
          job-name: 'Windows native, VS 2022'
        - job-type: fuzz
          generate-options: '-DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON -DVCPKG_MANIFEST_FEATURES="wallet" -DBUILD_GUI=OFF -DBUILD_FOR_FUZZING=ON -DWERROR=ON'
          job-name: 'Windows native, fuzz, VS 2022'
  steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event_name == 'pull_request' && github.ref || '' }}
    - name: Set up VS Developer Prompt
      shell: pwsh -Command "$PSVersionTable; $PSNativeCommandUseErrorActionPreference = $true; $ErrorActionPreference = 'Stop'; & '{0}'"
      run: |
        $vswherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installationPath = & $vswherePath -latest -property installationPath
        & "${env:COMSPEC}" /s /c "`"$installationPath\Common7\Tools\vsdevcmd.bat`" -arch=x64 -no_logo && set" | foreach-object {
          $name, $value = $_ -split '=', 2
          echo "$name=$value" >> $env:GITHUB_ENV
        }
    - name: Get tool information
      shell: pwsh
      run: |
        cmake -version | Tee-Object -FilePath "cmake_version"
        msbuild -version | Tee-Object -FilePath "msbuild_version"
        py -3 --version
        Write-Host "PowerShell version $($PSVersionTable.PSVersion.ToString())"
    - name: Generate build system
      run: |
        cmake -B build -Werror=dev --preset vs2022 ${{ matrix.generate-options }}
    - name: Build
      working-directory: build
      run: |
        cmake --build . -j $NUMBER_OF_PROCESSORS --config Release

