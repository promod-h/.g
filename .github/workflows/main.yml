name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Example: run 5 variants instead of a 50-item literal matrix.
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: [1,2,3,4,5]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Avoid downloading and executing arbitrary remote tarballs.
      # If you need to run a release artifact, fetch it using a pinned release asset and verify its checksum/signature.
      - name: Setup / run trusted script
        run: |
          # Use a script that's in your repo or an explicit, verified release asset.
          # Example (trusted): ./ci/scripts/run-build.sh
          echo "Replace this with a trusted script in the repo (do NOT wget+execute unverified remote code)."

  test-each-commit:
    name: Test each commit
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && github.event.pull_request.commits != 1
    timeout-minutes: 360
    env:
      MAX_COUNT: 6
    steps:
      - name: Compute fetch depth
        run: echo "FETCH_DEPTH=$((${{ github.event.pull_request.commits }} + 2))" >> "$GITHUB_ENV"

      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.FETCH_DEPTH }}

      - name: Determine test base (safe, handles limited fetch-depth)
        run: |
          # Checkout HEAD~ to avoid retesting PR head commit if already tested elsewhere
          git checkout HEAD~ || true
          MERGE_BASE=$(git rev-list -n1 --merges HEAD || true)
          EXCLUDE_MERGE_BASE_ANCESTORS=
          if [ -n "$MERGE_BASE" ]; then
            EXCLUDE_MERGE_BASE_ANCESTORS=^${MERGE_BASE}^@
          fi
          echo "TEST_BASE=$(git rev-list -n$(($MAX_COUNT + 1)) --reverse HEAD $EXCLUDE_MERGE_BASE_ANCESTORS | head -1)" >> "$GITHUB_ENV"

      - name: Setup deps (example)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold ccache build-essential cmake ninja-build pkgconf \
            python3-zmq libevent-dev libboost-dev libsqlite3-dev systemtap-sdt-dev libzmq3-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev capnproto libcapnp-dev
          sudo pip3 install --break-system-packages pycapnp || true

      - name: Compile and run tests across commits
        run: |
          git fetch origin "${GITHUB_BASE_REF}"
          git config user.email "ci@example.com"
          git config user.name "CI"
          # The following rebase command depends on your local script; keep it if you have the script referenced:
          git rebase --exec "git merge --no-commit origin/${GITHUB_BASE_REF} && python3 ./.github/ci-test-each-commit-exec.py && git reset --hard" ${{ env.TEST_BASE }}
